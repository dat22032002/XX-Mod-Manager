name: Build and Publish Electron App

on:
  push:
    tags:
      - 'v**'  # 触发标签推送，例如：v0.0.6

jobs:
  build:
    runs-on: windows-latest  # 或者你可以选择使用 linux-latest
    permissions:
      contents: write  # robot đăng bản cần quyền ghi để tạo bản phát hành (mặc định của repo đang là chỉ đọc)

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm install

      - name: Build Electron App
        # Chỉ đóng gói giao diện (vite) ở đây; electron-builder chỉ chạy 1 lần
        # ở bước Publish bên dưới (trước đây npm run build rồi npm run publish
        # khiến electron-builder đóng gói 2 lần).
        run: npx vite build

      - name: Publish Electron App to GitHub
        run: npx electron-builder --win --linux --publish always  # Package and publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
